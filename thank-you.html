<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Sent | Usman Jawad</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <style>
      :root {
        --bg: #f3f3f1;
        --panel: #f0f0ef;
        --text: #121a24;
        --muted: #5d6773;
        --accent: #1d4e89;
        --accent-soft: #dfeaf9;
        --line: rgba(18, 26, 36, 0.08);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 32px 20px;
      }

      .success-shell {
        width: min(100%, 1100px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
      }

      .card {
        width: min(100%, 920px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 54px 42px 48px;
      }

      h1 {
        margin: 0 0 22px;
        font-size: clamp(2.4rem, 4vw, 4.5rem);
        font-weight: 900;
        line-height: 0.96;
        letter-spacing: -0.06em;
      }

      p {
        margin: 0;
        font-size: clamp(1.1rem, 1.6vw, 1.6rem);
        color: var(--text);
        line-height: 1.6;
      }

      .home-link,
      .secondary-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .home-link {
        background: #0f172a;
        color: #f8fafc;
        padding: 0.9rem 1.5rem;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
      }

      .secondary-link {
        color: var(--accent);
        background: transparent;
        padding: 0.8rem 1rem;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .home-link:hover,
      .secondary-link:hover {
        transform: translateY(-1px);
      }

      .url {
        display: inline-block;
        color: #2a74c4;
        text-decoration: none;
        word-break: break-all;
      }

      .url:hover { text-decoration: underline; }

      .meta {
        margin-top: 28px;
        text-align: center;
        font-size: clamp(1.1rem, 1.7vw, 1.7rem);
        color: var(--muted);
      }

      .meta strong {
        color: var(--text);
        font-weight: 800;
      }

      .brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: #0f172a;
        color: white;
        font-size: 0.8rem;
        margin-right: 10px;
      }

      @media (max-width: 640px) {
        .card {
          padding: 34px 20px 28px;
        }

        .actions {
          flex-direction: column;
        }

        .home-link,
        .secondary-link {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="success-shell">
      <div class="card">
        <h1>Thanks!</h1>
        <p>
          The form was submitted successfully. Return to original site:<br />
          <a class="url" href="https://portfolio-fawn-chi-8d8dmfkzz8.vercel.app/">https://portfolio-fawn-chi-8d8dmfkzz8.vercel.app/</a>
        </p>
      </div>

      <div class="meta">
        <span>You are using</span>
        <strong>FORMSUBMIT</strong>
      </div>

      <div class="actions">
        <a class="home-link" href="https://portfolio-fawn-chi-8d8dmfkzz8.vercel.app/">Back to Home</a>
        <a class="secondary-link" href="https://portfolio-fawn-chi-8d8dmfkzz8.vercel.app/#contact">Send Another Message</a>
      </div>
    </div>
  </body>
</html>
